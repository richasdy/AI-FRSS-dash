version: '3.8'
services:
  be:
    build: ./be
    ports:
      - "3000:3000"
    volumes:
      - ./be/logs:/app/logs
    env_file:
      - ./be/.env
    restart: unless-stopped

  fe:
    build:
      context: ./fe
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
    depends_on:
      - be
    restart: unless-stopped


      

